services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://${USER_NAME}:${USER_PASS}@db:5432/${DB_NAME}?sslmode=disable
      SUPABASE_JWKS_URL: "https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1/.well-known/jwks.json"
      SUPABASE_ISSUER: "https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1"
      SUPABASE_AUDIENCE: "authenticated"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
  
  db:
    image: postgres:18
    volumes: 
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${USER_NAME}
      POSTGRES_PASSWORD: ${USER_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      # MVP中は直書き推奨（.envに自信あるなら ${...} でも可）
      test: ["CMD-SHELL", "pg_isready -U ${USER_NAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
